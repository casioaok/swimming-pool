<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบตรวจสอบเข้าสวนน้ำ</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <div class="container">
      <div class="card">
        <header>
          <h1>ระบบตรวจสอบเข้าสวนน้ำ</h1>
          <p>กรุณากรอกข้อมูลสำหรับเข้าสวนน้ำ</p>
        </header>

        <div class="form-group">
          <label>อายุของคุณ</label>
          <input type="number" id="age" placeholder="ระบุอายุเป็นตัวเลข">
        </div>

        <div class="form-group">
          <label>ผู้ปกครองดูแล</label>
          <select id="hasAdult">
            <option value="false">มาคนเดียว</option>
            <option value="true">มากับผู้ใหญ่</option>
          </select>
        </div>

        <button id="checkBtn">ตรวจสอบสิทธิ์</button>

        <div id="result" class="result-display">
          พร้อมตรวจสอบข้อมูล...
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
